<!--=================== MODAL EXCLUIR TAREFA=====================-->

<form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST" data-modal-form>

    <div class="modal-header">
        <h3 class="modal-title">Deletar tarefa</h3>
        <button type="button" class="button button-secondary button-small" data-close-modal aria-label="Fechar">✕</button>
    </div>

    <div class="modal-body">
        <p>Tem certeza que deseja deletar a tarefa <strong>{{ task.title }}</strong>?</p>
        <p class="muted-text">Essa ação não pode ser desfeita.</p>
    </div>

    <div class="modal-actions">
        <div class="modal-actions-group"></div>
        <div class="modal-actions-group">
            <button type="button" class="button button-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="button button-danger">Excluir</button>
        </div>
    </div>

</form>
