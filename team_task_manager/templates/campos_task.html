{# Campos compartilhados entre "Nova tarefa" e "Editar tarefa" #}

<!------------ Título ------------>

<div class="form-field">
    <label for="title" class="form-label">Título</label>
    <input type="text" id="title" name="title" class="form-input" maxlength="200"
           value="{{ values.title }}" required>
</div>

<!----------- Descrição ----------->
<div class="form-field">
    <label for="description" class="form-label">Descrição</label>
    <textarea id="description" name="description" class="form-textarea" rows="3" required>{{ values.description }}</textarea>
</div>

<div class="form-row">


    <!------------- Prazo ------------->
    <div class="form-field">
        <label for="deadline" class="form-label">Prazo</label>
        <input type="date" id="deadline" name="deadline" class="form-input"
               value="{{ values.deadline }}" required>
    </div>

    <!----------- Prioridade ----------->
    <div class="form-field">
        <label for="priority" class="form-label">Prioridade</label>
        <select id="priority" name="priority" class="form-select">
            {% for p in PRIORIDADES %}
            <option value="{{ p }}" {% if values.priority == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

</div>

<div class="form-row">

    <!------------- Status ------------->
    <div class="form-field">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="status" class="form-select">
            {% for s in STATUS_EDITAVEIS %}
            <option value="{{ s }}" {% if values.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
        <span class="form-hint">"Atrasada" é aplicada automaticamente quando o prazo passa.</span>
    </div>

    <!----------- Responsável ----------->
    <div class="form-field">
        <label for="assigned_to" class="form-label">Responsável</label>
        <select id="assigned_to" name="assigned_to" class="form-select">
            {% for u in users %}
            <option value="{{ u.id }}" {% if values.assigned_to == u.id|string %}selected{% endif %}>{{ u.username }}</option>
            {% endfor %}
        </select>
    </div>

</div>
