{% extends 'base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="form-narrow">
    <h1 class="h3 mb-3">Registro</h1>

    <form method="POST">
        <!----------------------------Usuário------------------------->
        <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <!------------------------------Senha------------------------->
        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <!----------------------------Telefone------------------------->
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" id="telefone" name="phone" class="form-control"
                    placeholder="(92) 99999-9999" inputmode="numeric" maxlength="15"
                    pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Use o formato (99) 99999-9999"
                    required>
        </div>
        <!--Formatação automatica do telefone-->
        <script>
        document.getElementById('telefone').addEventListener('input', function () {
            let d = this.value.replace(/\D/g, '').slice(0, 11);
            if (d.length > 10)      this.value = `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
            else if (d.length > 6)  this.value = `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
            else if (d.length > 2)  this.value = `(${d.slice(0,2)}) ${d.slice(2)}`;
            else if (d.length > 0)  this.value = `(${d}`;
            else                    this.value = '';
        });
        </script>
        <!---------------------------Tipo de conta-------------------------->
        <div class="mb-3">
            <label for="role" class="form-label">Tipo de conta</label>
            <select id="role" name="role" class="form-select">
                <option value="member">Membro</option>
                <option value="admin">Administrador</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>

    <p class="mt-3">Já possui uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
{% endblock %}
