{% extends "base.html" %}
{% block title %}Contatos{% endblock %}
{% block content %}

<h2 class="mb-3">Contatos</h2>

<div class="row g-3">

    {% for u in users %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ u.username }}</h5>
                <p class="card-text mb-0">
                    Telefone:
                    {% if u.telefone %}
                        {{ u.telefone|telefone }}
                    {% else %}
                        <span class="text-muted">não informado</span>
                    {% endif %}
                </p>
            </div>
        </div>
    </div>
    
    {% endfor %}
</div>

{% endblock %}
