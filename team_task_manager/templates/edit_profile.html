<!--=================== MODAL EDITAR DADOS =====================-->

<form action="{{ url_for('edit_profile') }}" method="POST" data-modal-form>

    <div class="modal-header">
        <h3 class="modal-title">Editar dados</h3>
        <button type="button" class="button button-secondary button-small" data-close-modal aria-label="Fechar">✕</button>
    </div>

    <div class="modal-body">
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <!------------- Usuário ------------->
        <div class="form-field">
            <label for="username" class="form-label">Usuário</label>
            <input type="text" id="username" name="username" class="form-input"
                   value="{{ values.username }}" required>
        </div>

        <!------------- Senha (opcional) ------------->
        <div class="form-field">
            <label for="password" class="form-label">Nova senha</label>
            <input type="password" id="password" name="password" class="form-input"
                   placeholder="Deixe em branco para manter a atual">
            <span class="form-hint">Só preencha se quiser trocar a senha.</span>
        </div>

        <!------------- Telefone ------------->
        <div class="form-field">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" id="telefone" name="phone" class="form-input"
                   value="{{ values.phone }}"
                   placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15"
                   pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Use o formato (00) 00000-0000"
                   required>
        </div>
    </div>

    <div class="modal-actions">
        <div class="modal-actions-group"></div>
        <div class="modal-actions-group">
            <button type="button" class="button button-secondary" data-close-modal>Cancelar</button>
            <button type="submit" class="button button-primary">Atualizar</button>
        </div>
    </div>

</form>
